[build-system]
requires = ["hatchling>=1.25.0"]
build-backend = "hatchling.build"

[project]
name = "azure-aws-migration-assistant"
version = "0.1.0"
description = "Agentic Azure-to-AWS infrastructure migration assistant scaffold."
readme = "azure-aws-migration-capstone.md"
requires-python = ">=3.11"
authors = [
  { name = "Migration Team" }
]
dependencies = [
  "langchain>=0.3.0",
  "langgraph>=0.2.0",
  "langgraph-checkpoint-sqlite>=2.0.0",
  "PyYAML>=6.0.2",
  "boto3>=1.35.0",
  "azure-cli>=2.65.0",
  "azure-identity>=1.19.0",
  "azure-mgmt-resource>=23.1.1",
  "pydantic>=2.9.0",
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.31.0",
  "psycopg[binary]>=3.2.0",
  "pgvector>=0.3.5",
  "python-dotenv>=1.0.1",
  "langsmith>=0.1.135",
  "langfuse>=2.48.0",
  "streamlit>=1.39.0"
]

[project.optional-dependencies]
dev = [
  "black>=24.8.0",
  "ruff>=0.6.9",
  "mypy>=1.11.2",
  "pytest>=8.3.3",
  "moto>=5.0.18",
  "hypothesis>=6.112.0",
  "cfn-lint>=1.17.0",
  "checkov>=3.2.277"
]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_configs = true
exclude = [
  "^infra/",
]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-q"
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["src"]
