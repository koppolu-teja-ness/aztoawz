rule_id: KV-003
source_service: Azure Key Vault
source_construct: keys
target_service: AWS KMS
target_construct: AWS::KMS::Key
property_map:
  key.kty: KeySpec
  key.keyOps: KeyUsage + policy_actions
  key.attributes.enabled: Enabled
  key.attributes.exp: pendingRotationDate
caveats:
  - Key operations map requires explicit IAM and key policy scoping per principal.
examples:
  - source:
      kty: RSA
      key_ops:
        - encrypt
        - decrypt
    target:
      KeySpec: RSA_2048
      KeyUsage: ENCRYPT_DECRYPT
confidence: 0.92
last_verified: 2026-09-29
