services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: aztoawz-app
    restart: unless-stopped
    environment:
      API_AUTH_MODE: api_key
      API_KEY: capstone-api-key
      APPROVAL_CHECKPOINT_DIR: /app/checkpoints
      MIGRATION_GRAPH_POSTGRES_DSN: postgresql://postgres:postgres@pgvector:5432/aztoawz
      DATABASE_URL: postgresql+psycopg://postgres:postgres@pgvector:5432/aztoawz
    command: ["uvicorn", "src.api:create_app", "--factory", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    ports:
      - "8000:8000"
    volumes:
      - ./:/app
      - app_checkpoints:/app/checkpoints
    depends_on:
      pgvector:
        condition: service_healthy

  pgvector:
    image: pgvector/pgvector:pg16
    container_name: aztoawz-pgvector
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: aztoawz
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d aztoawz"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - pgvector_data:/var/lib/postgresql/data

volumes:
  app_checkpoints:
  pgvector_data:
