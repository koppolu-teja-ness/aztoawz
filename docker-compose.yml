version: "3.9"

services:
  pgvector:
    image: pgvector/pgvector:pg16
    container_name: aztoawz-pgvector
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: aztoawz
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d aztoawz"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - pgvector_data:/var/lib/postgresql/data

volumes:
  pgvector_data:
